<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout cancelled</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #221527;
    color: #f6efe4;
    font-family: 'Inter', sans-serif;
  }
  .card { max-width: 420px; text-align: center; padding: 40px; }
  .badge {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #ff7a93;
    color: #1c1420;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    margin: 0 auto 24px;
  }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; margin: 0 0 12px; }
  p { color: #b6a6bf; line-height: 1.6; margin: 0 0 28px; }
  a.back {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 12px;
    background: #ff7a93;
    color: #1c1420;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">×</div>
    <h1>Checkout cancelled</h1>
    <p>No payment was made. You can pick another offer or try again whenever you're ready.</p>
    <a class="back" href="/">Back to offers</a>
  </div>
</body>
</html>
